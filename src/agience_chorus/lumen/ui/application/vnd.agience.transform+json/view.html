<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workflow</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 16px;
         font-size: 13px; color: #111827; background: #fff; }
  h2 { font-size: 12px; font-weight: 600; color: #6b7280; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  label { display: block; font-weight: 600; font-size: 12px; margin: 8px 0 4px; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 2px; }
  input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
  textarea { min-height: 54px; font-family: ui-monospace, monospace; font-size: 12px; }
  input[type=checkbox] { width: auto; }
  button { padding: 6px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font: inherit; }
  button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: #eef2ff; color: #3730a3; font-weight: 600; }
  .step { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #f3f4f6; }
  .step:first-child { border-top: 0; }
  .num { width: 22px; height: 22px; border-radius: 999px; background: #eef2ff; color: #3730a3; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .muted { color: #6b7280; }
  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .recipe { text-align: left; padding: 10px; border-radius: 8px; }
  .recipe b { display: block; margin-bottom: 2px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f9fafb; border-radius: 6px; padding: 8px; margin: 8px 0 0; font-size: 12px; max-height: 260px; overflow: auto; }
  .ok { color: #166534; } .err { color: #b91c1c; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="row" style="margin-bottom:12px">
    <input id="title" class="grow" placeholder="Name this workflow" style="font-size:15px;font-weight:600" />
    <div class="seg" id="kind">
      <button data-kind="step" class="on">One step</button>
      <button data-kind="workflow">Several steps</button>
    </div>
  </div>

  <div class="card" id="recipesCard">
    <h2>Start from a recipe</h2>
    <div class="recipes" id="recipes"></div>
  </div>

  <div class="card" id="stepCard">
    <h2>What it does</h2>
    <label for="tool">Tool</label>
    <select id="tool"></select>
    <div class="hint" id="toolHint"></div>
    <div id="argForm"></div>
  </div>

  <div class="card hidden" id="flowCard">
    <h2>Steps, in order</h2>
    <div id="steps"><div class="muted">No steps yet.</div></div>
    <div style="margin-top:10px;border-top:1px dashed #e5e7eb;padding-top:10px">
      <label for="newTool">Add a step</label>
      <select id="newTool"></select>
      <div class="hint" id="newToolHint"></div>
      <div id="newArgForm"></div>
      <label for="newName">Step name</label>
      <input id="newName" placeholder="e.g. Reconcile the accounts" />
      <div class="row" style="margin-top:8px"><button id="addStep">Add step</button>
        <span class="muted">or reuse</span>
        <select id="existing" class="grow"></select><button id="reuse" class="small">Use</button></div>
    </div>
  </div>

  <div class="row" style="margin-bottom:12px">
    <button id="save">Save</button>
    <button id="run" class="primary">Run now</button>
    <span id="status" class="muted"></span>
  </div>
  <pre id="result" class="hidden"></pre>

  <div class="card hidden" id="runsCard">
    <h2>Recent runs</h2>
    <div id="runs"></div>
  </div>

  <div class="card">
    <h2>Run it on a schedule</h2>
    <div class="row">
      <select id="every" style="width:auto">
        <option value="every_minutes">Every N minutes</option>
        <option value="daily_at">Daily at (HH:MM UTC)</option>
      </select>
      <input id="when" style="width:120px" value="60" />
      <label style="margin:0;font-weight:400" class="row"><input type="checkbox" id="inbox" checked /> tell me in my Inbox if it fails</label>
      <button id="schedule">Create timer</button>
    </div>
    <div class="hint" id="scheduleHint">A Timer card is made next to this one; open it and press Arm. It runs on a key you approve there.</div>
  </div>

<script>
let _id = 0; const _pending = {};
function rpc(method, params) {
  return new Promise((resolve, reject) => { const id = ++_id; _pending[id] = { resolve, reject };
    parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*'); });
}
window.addEventListener('message', (e) => {
  const d = e.data; if (!d || d.jsonrpc !== '2.0') return;
  if (d.id && _pending[d.id]) { const p = _pending[d.id]; delete _pending[d.id];
    d.error ? p.reject(new Error(d.error.message || 'failed')) : p.resolve(d.result); return; }
  if (d.method === 'ui/notifications/tool-result') onCard(d.params);
});
rpc('ui/initialize', { protocolVersion: '2026-01-26', clientInfo: { name: 'agience-viewer', version: '0.1.0' } })
  .then(() => parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }, '*'));

async function tool(name, args) {
  const res = await rpc('tools/call', { name, arguments: args });
  const text = (res && res.content && res.content[0] && res.content[0].text) || '';
  let data = text; try { data = JSON.parse(text); } catch { /* text */ }
  if (data && typeof data === 'object' && data.error) throw new Error(data.error);
  return data;
}

const $ = (id) => document.getElementById(id);
let artifactId = null, ctx = {}, catalog = { tools: [], steps: [], inbox_id: '' }, kind = 'step';

// What a person most often starts from. Each fills the form; nothing runs until they press Run.
const RECIPES = [
  { title: 'Reconcile accounts', blurb: 'Compare several write-ups of one event; agreements, conflicts, and an Inbox item per conflict.',
    server: 'lumen', tool: 'reconcile', args: { inbox_to: '$inbox' } },
  { title: 'Answer from my notes', blurb: 'A question answered with cited extracts from what you can read.',
    server: 'lumen', tool: 'synthesize', args: {} },
  { title: 'List my collections', blurb: 'A quick check that a step runs.', server: 'sage', tool: 'browse_collections', args: { limit: 10 } },
  { title: 'Raise an Inbox item', blurb: 'Put something in front of a person, with why.',
    server: 'lumen', tool: 'raise_item', args: { container_id: '$inbox' } },
];

function onCard(params) {
  for (const b of (params && params.content) || []) {
    if (b.type !== 'text' || !b.text) continue;
    try { const d = JSON.parse(b.text); artifactId = d.artifact_id || artifactId;
      ctx = typeof d.context === 'string' ? JSON.parse(d.context) : (d.context || {}); } catch { /* ignore */ }
  }
  kind = (ctx.run && ctx.run.type === 'workflow') ? 'workflow' : 'step';
  render();
  tool('workflow_catalog', { workflow_id: artifactId }).then((c) => { catalog = c; render(); })
    .catch((e) => status(e.message, true));
}

function toolKey(t) { return `${t.server}:${t.name}`; }
function findTool(key) { return catalog.tools.find((t) => toolKey(t) === key); }

function fillToolSelect(sel, chosen) {
  sel.replaceChildren(new Option('Choose a tool…', ''));
  const groups = {};
  for (const t of catalog.tools) (groups[t.server] = groups[t.server] || []).push(t);
  for (const server of Object.keys(groups).sort()) {
    const g = document.createElement('optgroup'); g.label = server;
    for (const t of groups[server]) g.appendChild(new Option(t.name, toolKey(t)));
    sel.appendChild(g);
  }
  sel.value = chosen || '';
}

// A form from the tool's own input schema: one field per argument, required ones marked. With
// `sources` (a workflow step), each argument can instead take what an earlier step returned.
function argForm(host, t, values, sources) {
  host.replaceChildren();
  if (!t) return;
  const props = (t.input_schema && t.input_schema.properties) || {};
  const required = new Set((t.input_schema && t.input_schema.required) || []);
  for (const [name, spec] of Object.entries(props)) {
    const l = document.createElement('label');
    l.textContent = name + (required.has(name) ? ' *' : '');
    const type = (spec && spec.type) || (spec && spec.anyOf && (spec.anyOf.find((x) => x.type !== 'null') || {}).type) || 'string';
    let input;
    if (type === 'boolean') { input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!values[name]; }
    else if (type === 'object' || type === 'array') { input = document.createElement('textarea');
      input.value = values[name] !== undefined ? JSON.stringify(values[name], null, 1) : ''; input.placeholder = type === 'array' ? '[ ]' : '{ }'; }
    else { input = document.createElement('input'); input.type = (type === 'integer' || type === 'number') ? 'number' : 'text';
      input.value = values[name] !== undefined ? (values[name] === '$inbox' ? catalog.inbox_id || '' : values[name]) : ''; }
    input.dataset.arg = name; input.dataset.type = type;
    host.appendChild(l);
    if (sources && sources.length) {
      const row = document.createElement('div'); row.className = 'row';
      const src = document.createElement('select'); src.dataset.srcFor = name; src.style.width = 'auto';
      src.appendChild(new Option('a value I type', 'typed'));
      for (const [label, value] of sources) src.appendChild(new Option(label, value));
      const path = document.createElement('input'); path.dataset.pathFor = name; path.placeholder = 'field inside it (optional)';
      path.className = 'grow hidden';
      src.onchange = () => { const typed = src.value === 'typed';
        input.classList.toggle('hidden', !typed); path.classList.toggle('hidden', typed); };
      row.append(src, path); host.appendChild(row);
    }
    host.appendChild(input);
    if (spec && spec.description) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = spec.description; host.appendChild(h); }
  }
  if (!Object.keys(props).length) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'This tool takes no arguments.'; host.appendChild(h); }
}

function readArgs(host) {
  const out = {};
  const fromSteps = {};
  for (const sel of host.querySelectorAll('[data-src-for]')) {
    if (sel.value === 'typed') continue;
    const path = (host.querySelector(`[data-path-for="${sel.dataset.srcFor}"]`) || {}).value || '';
    fromSteps[sel.dataset.srcFor] = `$.${sel.value}` + (path.trim() ? `.${path.trim()}` : '');
  }
  for (const el of host.querySelectorAll('[data-arg]')) {
    if (el.dataset.arg in fromSteps) { out[el.dataset.arg] = fromSteps[el.dataset.arg]; continue; }
    const t = el.dataset.type, v = t === 'boolean' ? el.checked : el.value.trim();
    if (v === '' || v === undefined) continue;
    if (t === 'integer' || t === 'number') out[el.dataset.arg] = Number(v);
    else if (t === 'object' || t === 'array') out[el.dataset.arg] = JSON.parse(v);
    else out[el.dataset.arg] = v;
  }
  return out;
}

function renderRuns() {
  const runs = catalog.runs || [];
  $('runsCard').classList.toggle('hidden', !runs.length);
  $('runs').replaceChildren(...runs.map((r) => {
    const d = document.createElement('details');
    const sm = document.createElement('summary');
    sm.textContent = `${(r.started_at || '').slice(0, 16).replace('T', ' ')} — ${r.status || '?'}`;
    sm.className = r.status === 'failed' ? 'err' : (r.status === 'completed' ? 'ok' : 'muted');
    d.appendChild(sm);
    for (const st of r.steps || []) {
      const pre = document.createElement('pre');
      pre.textContent = `${(st.index ?? 0) + 1}. ${st.name} — ${st.status}\n${st.error || st.output || ''}`;
      d.appendChild(pre);
    }
    return d;
  }));
}

function render() {
  renderRuns();
  $('title').value = ctx.title || '';
  for (const b of $('kind').querySelectorAll('button')) b.classList.toggle('on', b.dataset.kind === kind);
  $('stepCard').classList.toggle('hidden', kind !== 'step');
  $('flowCard').classList.toggle('hidden', kind !== 'workflow');
  $('recipesCard').classList.toggle('hidden', Boolean(ctx.run && (ctx.run.tool || (ctx.run.steps || []).length)));

  $('recipes').replaceChildren(...RECIPES.map((r) => { const b = document.createElement('button'); b.className = 'recipe';
    b.innerHTML = '<b></b><span class="muted"></span>'; b.querySelector('b').textContent = r.title;
    b.querySelector('span').textContent = r.blurb; b.onclick = () => useRecipe(r); return b; }));

  const run = ctx.run || {};
  const chosen = run.type === 'mcp-tool' ? `${run.server}:${run.tool}` : '';
  fillToolSelect($('tool'), chosen);
  const t = findTool(chosen); $('toolHint').textContent = (t && t.description) || '';
  argForm($('argForm'), t, run.input_mapping || {});

  fillToolSelect($('newTool'), $('newTool').value);
  const steps = run.type === 'workflow' ? (run.steps || []) : [];
  const names = Object.fromEntries((catalog.steps || []).map((s) => [s.id, s]));
  $('steps').replaceChildren(...(steps.length ? steps.map((s, i) => {
    const row = document.createElement('div'); row.className = 'step';
    const known = names[s.transform_id];
    row.innerHTML = `<span class="num">${i + 1}</span><span class="grow"><b></b><div class="muted"></div></span>`;
    row.querySelector('b').textContent = s.name || (known && known.title) || s.transform_id;
    row.querySelector('.muted').textContent = known ? known.does : s.transform_id;
    for (const [label, fn] of [['↑', () => move(i, -1)], ['↓', () => move(i, 1)], ['Remove', () => removeStep(i)]]) {
      const b = document.createElement('button'); b.className = 'small'; b.textContent = label; b.onclick = fn; row.appendChild(b);
    }
    return row;
  }) : [Object.assign(document.createElement('div'), { className: 'muted', textContent: 'No steps yet. Add one below.' })]));
  $('existing').replaceChildren(new Option('an existing step…', ''),
    ...(catalog.steps || []).filter((s) => s.id !== artifactId).map((s) => new Option(s.title, s.id)));
}

function status(text, bad) { $('status').textContent = text || ''; $('status').className = bad ? 'err' : 'muted'; }

async function save(next) {
  ctx = { ...ctx, ...next, title: $('title').value.trim() || ctx.title || 'Workflow', content_type: 'application/vnd.agience.transform+json' };
  await rpc('tools/call', { name: 'update_artifact', arguments: { id: artifactId, patch: { context: JSON.stringify(ctx) } } });
}

function currentStepRun() {
  const t = findTool($('tool').value);
  if (!t) throw new Error('Choose a tool first.');
  return { type: 'mcp-tool', server: t.server, tool: t.name, input_mapping: readArgs($('argForm')) };
}

async function saveNow() {
  status('Saving…');
  try {
    if (kind === 'step') await save({ run: currentStepRun() });
    else await save({ run: { type: 'workflow', steps: ((ctx.run && ctx.run.type === 'workflow') ? ctx.run.steps : []) || [] } });
    status('Saved.'); render();
  } catch (e) { status(e.message, true); }
}

function useRecipe(r) {
  kind = 'step';
  const t = catalog.tools.find((x) => x.server === r.server && x.name === r.tool);
  if (!t) { status(`${r.server}: ${r.tool} is not available to you.`, true); return; }
  ctx = { ...ctx, title: ctx.title || r.title, run: { type: 'mcp-tool', server: r.server, tool: r.tool, input_mapping: r.args } };
  render(); status('Fill in the fields, then Save and Run now.');
}

async function move(i, d) {
  const steps = [...(ctx.run.steps || [])]; const j = i + d; if (j < 0 || j >= steps.length) return;
  [steps[i], steps[j]] = [steps[j], steps[i]]; await save({ run: { type: 'workflow', steps } }); render();
}
async function removeStep(i) {
  const steps = [...(ctx.run.steps || [])]; steps.splice(i, 1); await save({ run: { type: 'workflow', steps } }); render();
}

$('kind').onclick = (e) => { const k = e.target.dataset && e.target.dataset.kind; if (!k) return;
  kind = k; if (k === 'workflow' && !(ctx.run && ctx.run.type === 'workflow')) ctx = { ...ctx, run: { type: 'workflow', steps: [] } };
  render(); };
$('tool').onchange = () => { const t = findTool($('tool').value); $('toolHint').textContent = (t && t.description) || ''; argForm($('argForm'), t, {}); };
function stepSources() {
  const steps = (ctx.run && ctx.run.type === 'workflow' && ctx.run.steps) || [];
  if (!steps.length) return [];
  return [["the previous step's output", 'previous'],
          ...steps.map((st) => [`the output of "${st.name}"`, `steps.${st.name}`])];
}
$('newTool').onchange = () => { const t = findTool($('newTool').value); $('newToolHint').textContent = (t && t.description) || ''; argForm($('newArgForm'), t, {}, stepSources()); };
$('save').onclick = saveNow;

$('addStep').onclick = async () => {
  const t = findTool($('newTool').value); if (!t) { status('Choose the step\'s tool.', true); return; }
  status('Adding…');
  try {
    if (!$('title').value.trim()) $('title').value = 'Workflow';
    await save({ run: { type: 'workflow', steps: ((ctx.run && ctx.run.steps) || []) } });
    const out = await tool('add_workflow_step', { workflow_id: artifactId, server: t.server, tool: t.name,
      arguments: readArgs($('newArgForm')), name: $('newName').value.trim() });
    ctx = { ...ctx, run: out.run }; catalog = await tool('workflow_catalog', { workflow_id: artifactId });
    $('newName').value = ''; status('Step added.'); render();
  } catch (e) { status(e.message, true); }
};
$('reuse').onclick = async () => {
  const id = $('existing').value; if (!id) return;
  const s = (catalog.steps || []).find((x) => x.id === id);
  const steps = [...((ctx.run && ctx.run.steps) || []), { name: s ? s.title : '', transform_id: id }];
  await save({ run: { type: 'workflow', steps } }); status('Step added.'); render();
};

// A step's answer arrives as the tool's MCP result (text in `content`, `isError` on failure),
// sometimes passed on whole inside another; a person reads the tool's own answer, or its error.
function unwrap(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.content)) return o;
  const text = (o.content[0] && o.content[0].text) || '';
  if (o.isError) throw new Error(text || 'the tool reported an error');
  try {
    const j = JSON.parse(text);
    if (j && typeof j === 'object' && j.error) throw new Error(j.error);
    return j;
  } catch (e) { if (e instanceof SyntaxError) return text; throw e; }
}

$('run').onclick = async () => {
  await saveNow(); if ($('status').className === 'err') return;
  status('Running…'); $('run').disabled = true;
  try {
    const out = unwrap(unwrap(await tool('execute_transform', { transform_id: artifactId })));
    $('result').classList.remove('hidden');
    $('result').textContent = typeof out === 'string' ? out : JSON.stringify(out, null, 2);
    status('Done.');
    tool('workflow_catalog', { workflow_id: artifactId }).then((c) => { catalog = c; renderRuns(); }).catch(() => {});
  } catch (e) { $('result').classList.remove('hidden'); $('result').textContent = e.message; status('It failed.', true); }
  finally { $('run').disabled = false; }
};

$('schedule').onclick = async () => {
  status('Creating the timer…');
  try {
    await saveNow();
    const every = $('every').value, when = $('when').value.trim();
    const args = { workspace_id: catalog.workspace_id, target_artifact_id: artifactId, title: `${ctx.title || 'Workflow'} (schedule)` };
    args[every] = every === 'every_minutes' ? Number(when) : when;
    if ($('inbox').checked && catalog.inbox_id) args.inbox_to = catalog.inbox_id;
    // The timer records each run where the workflow keeps its runs, so its key reaches them.
    if (catalog.runs_to) args.results_to = catalog.runs_to;
    const out = await tool('schedule_action', args);
    $('scheduleHint').textContent = `Timer "${args.title}" is ready next to this card. Open it and press Arm.`;
    status(out.timer_id ? 'Timer created.' : '');
  } catch (e) { status(e.message, true); }
};
</script>
</body>
</html>
