<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; color: #111827; font-size: 13px; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .label { color: #6b7280; }
  .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  label { font-weight: 600; font-size: 12px; }
  input, select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .btns { display: flex; gap: 8px; }
  button { padding: 7px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 13px; }
  button.primary { background: #0f766e; color: #fff; border-color: #0f766e; }
  button:disabled { opacity: 0.5; cursor: default; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .armed { background: #ccfbf1; color: #115e59; }
  .off { background: #f3f4f6; color: #6b7280; }
  .error { color: #b91c1c; margin-bottom: 8px; }
  .hidden { display: none; }
  .pick { display: flex; gap: 6px; align-items: center; }
  .picked { flex: 1; padding: 6px 8px; border: 1px dashed #d1d5db; border-radius: 6px; color: #374151; }
  button.small { padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
  <div id="title" style="font-weight:600;font-size:15px;margin-bottom:10px">Timer</div>
  <div class="card">
    <div class="row"><span class="label">Status</span><span id="status" class="badge off">Not armed</span></div>
    <div class="row"><span class="label">Last run</span><span id="lastRun">—</span></div>
    <div class="row"><span class="label">Last result</span><span id="lastStatus">—</span></div>
    <div class="row"><span class="label">Runs</span><span id="runs">0</span></div>
  </div>

  <div class="error hidden" id="error"></div>

  <div class="card">
    <div class="form-group">
      <label for="scheduleKind">Runs</label>
      <select id="scheduleKind">
        <option value="every_minutes">Every N minutes</option>
        <option value="daily_at">Daily at</option>
        <option value="at">Once, at</option>
      </select>
      <input id="scheduleMinutes" type="number" min="1" step="1" placeholder="15" data-kind="every_minutes">
      <input id="scheduleTime" type="time" data-kind="daily_at">
      <input id="scheduleAt" type="datetime-local" data-kind="at">
    </div>
    <div class="form-group">
      <label>Target</label>
      <div class="pick"><span class="picked" data-pick-for="target">nothing chosen</span>
        <button class="small" data-choose="target">Choose…</button></div>
    </div>
    <div class="form-group">
      <label for="operation">Operation</label>
      <input id="operation" value="invoke">
    </div>
    <div class="form-group">
      <label>Record each run in (optional)</label>
      <div class="pick"><span class="picked" data-pick-for="results_to">nothing chosen</span>
        <button class="small" data-choose="results_to">Choose…</button>
        <button class="small" data-clear="results_to">Clear</button></div>
    </div>
    <div class="form-group">
      <label>Raise a failed run as an Inbox item in (optional)</label>
      <div class="pick"><span class="picked" data-pick-for="inbox_to">nothing chosen</span>
        <button class="small" data-choose="inbox_to">Choose…</button>
        <button class="small" data-clear="inbox_to">Clear</button></div>
    </div>
    <div class="btns">
      <button id="saveBtn" onclick="handleSave()">Save</button>
      <button id="armBtn" class="primary" onclick="handleArm()">Arm</button>
      <button id="disarmBtn" class="hidden" onclick="handleDisarm()">Disarm</button>
    </div>
  </div>

  <script type="module">
    let _rpcId = 0;
    const _pending = {};
    function sendRpc(method, params) {
      const id = ++_rpcId;
      return new Promise((resolve, reject) => {
        _pending[id] = { resolve, reject };
        parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      });
    }
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.jsonrpc !== '2.0') return;
      if (d.id && _pending[d.id]) {
        if (d.error) _pending[d.id].reject(d.error); else _pending[d.id].resolve(d.result);
        delete _pending[d.id];
        return;
      }
      if (d.method === 'ui/notifications/tool-result') handleToolResult(d.params);
      if (d.method === 'ui/notifications/picker-result') onPicked(d.params || {});
    });
    sendRpc('ui/initialize', { protocolVersion: '2026-01-26', clientInfo: { name: 'agience-viewer', version: '0.1.0' } })
      .then(() => { parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized' }, '*'); render(); });

    let artifactId = null;
    let ctx = {};

    function handleToolResult(params) {
      for (const block of (params && params.content) || []) {
        if (block.type !== 'text' || !block.text) continue;
        try {
          const data = JSON.parse(block.text);
          artifactId = data.artifact_id || artifactId;
          ctx = typeof data.context === 'string' ? JSON.parse(data.context) : (data.context || {});
          render();
        } catch { /* ignore */ }
      }
    }

    // Times are stored as UTC and shown and picked in local time, as the type declares.
    const pad = (n) => String(n).padStart(2, '0');
    function localText(iso) {
      const d = iso ? new Date(iso) : null;
      return d && !isNaN(d) ? d.toLocaleString() : '—';
    }
    function atToPicker(iso) {
      const d = iso ? new Date(iso) : null;
      if (!d || isNaN(d)) return '';
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    const pickerToAt = (v) => (v ? new Date(v).toISOString() : '');
    function utcToLocalTime(hhmm) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
      if (!m) return '';
      const d = new Date(); d.setUTCHours(+m[1], +m[2], 0, 0);
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function localTimeToUtc(hhmm) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || ''));
      if (!m) return '';
      const d = new Date(); d.setHours(+m[1], +m[2], 0, 0);
      return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
    }
    const scheduleInputs = () => document.querySelectorAll('[data-kind]');
    function showScheduleInput() {
      const kind = document.getElementById('scheduleKind').value;
      scheduleInputs().forEach(el => el.classList.toggle('hidden', el.dataset.kind !== kind));
    }
    document.getElementById('scheduleKind').addEventListener('change', showScheduleInput);

    // Each artifact the timer points at is chosen with the app's picker; the view keeps its id and,
    // to show it, its title.
    const PICKS = {
      target: { label: 'The workflow or operator to run',
                content_types: ['application/vnd.agience.transform+json', 'application/vnd.agience.operator+json'] },
      results_to: { label: 'Where each run is recorded' },
      inbox_to: { label: 'Where a failed run is raised' },
    };
    let picks = {};
    function pickedFrom(t) {
      const titles = t.titles || {};
      const ids = { target: t.target && t.target.artifact_id, results_to: t.results_to, inbox_to: t.inbox_to };
      const out = {};
      for (const [k, id] of Object.entries(ids)) if (id) out[k] = { id, title: titles[k] || id };
      return out;
    }
    function showPicks() {
      document.querySelectorAll('[data-pick-for]').forEach(el => {
        const p = picks[el.dataset.pickFor];
        el.textContent = p ? p.title : 'nothing chosen';
      });
    }
    function onPicked(r) {
      if (!r.artifact_id || !PICKS[r.role]) return;
      picks[r.role] = { id: r.artifact_id, title: r.title || r.artifact_id };
      showPicks();
    }
    document.querySelectorAll('[data-choose]').forEach(b => b.addEventListener('click', () => {
      const role = b.dataset.choose;
      parent.postMessage({ jsonrpc: '2.0', method: 'ui/open-picker', params: { role, ...PICKS[role] } }, '*');
    }));
    document.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => {
      delete picks[b.dataset.clear]; showPicks();
    }));

    // Armed on the job grant its owner approved at Origin (a timer armed on a key before is armed again).
    const armed = () => Boolean(ctx.job_grant && ctx.job_grant.grant_id && !ctx.job_grant.disarmed_at);

    function render() {
      const t = ctx.timer || {}, s = t.schedule || {}, st = ctx.timer_state || {};
      document.getElementById('title').textContent = ctx.title || 'Timer';
      const kind = ['every_minutes', 'daily_at', 'at'].find(k => s[k] !== undefined) || 'every_minutes';
      document.getElementById('scheduleKind').value = kind;
      document.getElementById('scheduleMinutes').value = s.every_minutes ?? '';
      document.getElementById('scheduleTime').value = utcToLocalTime(s.daily_at);
      document.getElementById('scheduleAt').value = atToPicker(s.at);
      showScheduleInput();
      picks = pickedFrom(t);
      showPicks();
      document.getElementById('operation').value = (t.target && t.target.operation) || 'invoke';
      document.getElementById('lastRun').textContent = localText(st.last_run);
      document.getElementById('lastStatus').textContent = !st.last_status ? '—'
        : st.last_ok === false ? `failed (${st.last_status}): ${st.last_error || ''}` : `ok (${st.last_status})`;
      document.getElementById('runs').textContent = String(st.runs || 0);
      const status = document.getElementById('status');
      status.textContent = armed() ? 'Armed' : 'Not armed';
      status.className = 'badge ' + (armed() ? 'armed' : 'off');
      document.getElementById('armBtn').classList.toggle('hidden', armed());
      document.getElementById('disarmBtn').classList.toggle('hidden', !armed());
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg; el.classList.toggle('hidden', !msg);
    }

    function readForm() {
      const kind = document.getElementById('scheduleKind').value;
      const schedule = kind === 'every_minutes'
        ? { every_minutes: parseInt(document.getElementById('scheduleMinutes').value, 10) }
        : kind === 'daily_at'
          ? { daily_at: localTimeToUtc(document.getElementById('scheduleTime').value) }
          : { at: pickerToAt(document.getElementById('scheduleAt').value) };
      const timer = {
        ...(ctx.timer || {}),
        schedule,
        target: { artifact_id: (picks.target && picks.target.id) || '',
                  operation: document.getElementById('operation').value.trim() || 'invoke',
                  body: (ctx.timer && ctx.timer.target && ctx.timer.target.body) || {} },
      };
      for (const k of ['results_to', 'inbox_to']) {
        if (picks[k]) timer[k] = picks[k].id; else delete timer[k];
      }
      timer.titles = Object.fromEntries(Object.entries(picks).map(([k, p]) => [k, p.title]));
      return timer;
    }

    async function save(next) {
      ctx = next;
      await sendRpc('tools/call', { name: 'update_artifact',
        arguments: { id: artifactId, patch: { context: JSON.stringify(ctx) } } });
      render();
    }

    window.handleSave = async function() {
      showError('');
      try { await save({ ...ctx, timer: readForm() }); } catch (e) { showError(e.message || 'Save failed'); }
    };

    // The host shows what the timer reaches, the owner approves a job grant over it at Origin, and the
    // host hands the grant to Lumen; no key exists. The view records the grant's id and reach.
    window.handleArm = async function() {
      showError('');
      try {
        const timer = readForm();
        if (!timer.target.artifact_id) { showError('Choose the target first.'); return; }
        await save({ ...ctx, timer });
        const res = await sendRpc('tools/call', { name: 'arm_timer', arguments: { timer_id: artifactId } });
        const grant = JSON.parse(res.content[0].text);
        const { key: _retired, ...rest } = ctx;
        await save({ ...rest, job_grant: { grant_id: grant.job_grant, reach: grant.resources,
                                           armed_at: new Date().toISOString() } });
      } catch (e) { showError((e && e.message) || 'Arming failed'); }
    };

    window.handleDisarm = async function() {
      showError('');
      try {
        const res = await sendRpc('tools/call', { name: 'disarm_timer', arguments: { timer_id: artifactId } });
        const out = JSON.parse(res.content[0].text);
        await save({ ...ctx, job_grant: { ...ctx.job_grant, disarmed_at: new Date().toISOString(),
                                          ...(out.revoked ? { revoked_at: new Date().toISOString() } : {}) } });
      } catch (e) { showError((e && e.message) || 'Disarming failed'); }
    };
  </script>
</body>
</html>
