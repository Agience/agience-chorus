[pytest]
# importlib mode: each test module is imported by its REAL PATH, so two personas' same-named test
# files do not fight over one entry in sys.modules.
#
# ⚠ CORRECTED 2026-07-29 (Environment Builder). The previous comment here claimed importlib gave
# "no name collision, no __init__.py churn". MEASURED, that was false — and the false belief is why
# the bug survived: every `src/<persona>/tests/` carried an empty `__init__.py` while no
# `src/<persona>/` did, so pytest resolved EVERY persona's test package to the same dotted name
# `tests.*`. Under importlib that is not an error: it SILENTLY substitutes. `sage/tests/
# test_reach_provider.py` collected LUMEN's four test names, sage's own eight never ran, and the
# combined run reported 323 tests where the personas sum to 327. It also mis-attributed three real
# failures to the wrong persona, and it kept `src/conftest.py`'s session fixture from ever applying.
#
# The fix was structural, not an invocation flag: the 6 empty `tests/__init__.py` markers were
# REMOVED (they are what defeated per-path naming), and colliding basenames were made unique
# (`test_reach_provider_<persona>.py`, `test_startup_<persona>.py`). `src/tests/
# test_no_duplicate_test_basenames.py` now fails if a duplicate basename is ever added back —
# because a test that vanishes reads as green, and running the suites separately HID this rather
# than avoiding it.
addopts = --import-mode=importlib

# ⚠ ADDED 2026-07-30. `src/conftest.py` does `from _chorus_identity import …`, and the personas
# import each other's helpers by bare name — all of which require `src/` on sys.path. Under
# `--import-mode=importlib` pytest does NOT add conftest directories to sys.path (that is the
# rootdir-insertion behaviour of the older prepend mode), so a bare `pytest` in this repo failed at
# collection with `ModuleNotFoundError: No module named '_chorus_identity'` and every run needed a
# hand-passed PYTHONPATH.
#
# A suite that only passes under an invocation nobody wrote down is not a gate: the next person
# reads the failure as a broken repo. The other half of that failure — `No module named 'origin'` —
# is fixed properly, by giving agience-origin packaging metadata so it can be pip-installed and
# DECLARED (see agience-crystal/pyproject.toml and agience-mantle's `service` extra). This line
# covers only what is genuinely path layout rather than a dependency.
pythonpath = src
