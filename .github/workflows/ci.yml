name: ci

# Three jobs, because this repository holds three things that fail in different ways: the tektons,
# the payloads they ship as, and two web applications with their own build.
#
# `publish.yml` cuts the release. Chorus is distributed as `agience-chorus`, importing as
# `agience_chorus`, with one extra per tekton — see `pyproject.toml`. This file gates every commit
# on main; the tag that publishes points at a commit this has already passed.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  # The Python suite. Every sibling below is PUBLIC, so none of these checkouts needs a token, and a
  # fork can run this job as-is.
  #
  # Chorus reaches all four: `crystal` at 87 import sites, `prism` at 73, `mantle` at 40, and
  # `ember` at exactly one — `src/conftest.py`, a fixture file. Product code imports no ember, and
  # `src/tests/test_chorus_does_not_import_ember.py` is what holds that.
  #
  # Each `path:` is the repository's own name. `src/conftest.py` locates ember's shared test doubles
  # by looking for a directory called `agience-ember`; under a shortened name it finds nothing, adds
  # nothing to the path, and the two files that compare chorus against ember SKIP — green, and
  # measuring neither. That is what this job is for, so the name is part of the check.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/agience-prism-py", path: .siblings/agience-prism-py }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/agience-crystal", path: .siblings/agience-crystal }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/agience-mantle", path: .siblings/agience-mantle }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/agience-ember", path: .siblings/agience-ember }
      # `.siblings/` now holds every repository the bundle spec names EXCEPT this one. The spec
      # declares module sources workspace-relatively (`agience-chorus/...`, `agience-crystal/...`),
      # so `src/agience_chorus/seraph/tests/test_bundling.py` needs one directory holding both — that is
      # `.siblings/` once chorus itself appears there. A link, not a copy: the payloads are compared
      # byte-for-byte against this checkout's source, so it must BE this checkout.
      - name: Make .siblings a complete workspace
        run: ln -s "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.siblings/agience-chorus"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      # `[optics]` on ember is not optional HERE. `ember/optics.py` imports entroptics eagerly —
      # it is the one door onto the instrument — and chorus reaches it transitively: any test
      # whose import chain runs through `ophan.market_frame` or `lumen.curriculum` lands there.
      # Without the extra those four modules fail at COLLECTION, which stops the whole run.
      # entroptics is published (0.2.1) and its repository is public, so this needs no token.
      - run: pip install './.siblings/agience-prism-py[trust,vector,wire]' './.siblings/agience-crystal[service,ontology]' ./.siblings/agience-mantle './.siblings/agience-ember[optics]'
      # The checkout, installed as the package it now is, with every tekton's extras and the
      # test tools. `requirements.txt` resolves to `-e .[all]`; `[dev]` adds pytest.
      - run: pip install -e ".[all,dev]"
      - name: Run the suite
        env:
          # The operator payloads are this repository's own — chorus builds them from chorus source
          # — so this points at the checkout rather than at a sibling.
          # The payloads live inside the package now, so the wheel carries them.
          AGIENCE_BUNDLE_ROOT: ${{ github.workspace }}/src/agience_chorus/bundles
          # One thread is the only safe setting in CI: OpenBLAS otherwise faults at exit or hangs.
          OPENBLAS_NUM_THREADS: "1"
        run: python -m pytest -q --timeout=300

  # The payloads must equal what the builder produces from current source. A stale bundle is the one
  # defect that cannot be caught by running the code: the runtime reads the PAYLOAD, so an edit to
  # `src/<tekton>/*.py` that was never rebuilt is inert, and the sha the mesh publishes disagrees
  # with the source in this repository.
  #
  # The builder is a CLI in `agience-observe`; the production logic is chorus's own
  # `src/agience_chorus/seraph/bundling.py`, which this repository already tests. Only the command
  # lives there.
  bundles-match-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/agience-prism-py", path: .siblings/agience-prism-py }
      # `agience-observe` went public on 2026-09-09, so the default GITHUB_TOKEN reads it and no
      # secret is involved. It carried `token: ${{ secrets.WORKSPACE_READ_TOKEN }}` while observe was
      # private, alongside `continue-on-error` and a guard that skipped the check when the checkout
      # failed — and THAT COMBINATION HID A DEAD JOB FOR TWO WEEKS. `continue-on-error` sets a failed
      # step's *conclusion* to success while its *outcome* stays failure; the UI shows conclusion, so
      # the checkout looked green, `steps.builder.outcome == 'success'` was false, the check was
      # skipped, and the job passed having verified nothing. The token had expired or lost its scope
      # and nothing said so.
      #
      # There is no escape hatch now, deliberately. If this checkout fails the job fails, because a
      # green run has to mean the payloads were compared.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agience-observe
          path: .siblings/agience-observe
      # `build_bundles.py` is only a CLI: the producer is chorus's own
      # `src/agience_chorus/seraph/bundling.py`, and it is looked for at `.siblings/agience-chorus/`
      # — deliberately, so there is no second implementation that could drift from the first. The
      # suite job makes the same link for the same reason. This job needs it too, and did not have
      # it: the observe checkout failed first for two weeks, so nothing ever reached far enough to
      # find out.
      - name: Make .siblings a complete workspace
        run: ln -s "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.siblings/agience-chorus"
      # No `cache: pip` here, unlike the suite job. This job pip-installs NOTHING — it runs a
      # checker out of a sibling checkout — so the cache action's post step finds no
      # `~/.cache/pip` to save and fails the job at the very end.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bundles match chorus source
        run: python .siblings/agience-observe/build_bundles.py --check

  # One web application. `aria/www` — the public site's React front end — is work in progress and
  # is not carried in this repository; only its backend-for-frontend
  # (`src/agience_chorus/aria/www/bff/`) is, and
  # that is Python, covered by the suite job above.
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [src/agience_chorus/astra/web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --prefix ${{ matrix.app }}
      - run: npm run build --prefix ${{ matrix.app }}
      - name: Test, where the app has a suite
        run: |
          if node -e "process.exit(require('./${{ matrix.app }}/package.json').scripts.test?0:1)"; then
            npm run test --prefix ${{ matrix.app }}
          else
            echo "no test script in ${{ matrix.app }} — build and lint are the signal"
          fi
      - run: npm run lint --prefix ${{ matrix.app }}
